<mat-toolbar class="toolbar">
  @if (isCompact()) {
    <button mat-icon-button type="button" (click)="sidenav.toggle()"
            [attr.aria-label]="'toolbar.open-menu' | translate" [attr.aria-expanded]="sidenav.opened">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <img class="toolbar-logo" src="assets/trailquest-logo.svg" width="40" height="40"
       [alt]="'toolbar.logo-alt' | translate">
  <span class="toolbar-title">{{ 'toolbar.title' | translate }}</span>
  <span class="toolbar-spacer"></span>
  <app-language-switcher />
</mat-toolbar>
<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav class="sidenav" [mode]="isCompact() ? 'over' : 'side'" [opened]="!isCompact()">
    <nav [attr.aria-label]="'sidenav.navigation' | translate">
      <mat-nav-list>
        @for (option of options; track option.link) {
          <a mat-list-item [routerLink]="option.link" routerLinkActive="active"
             ariaCurrentWhenActive="page" [activated]="rla.isActive" #rla="routerLinkActive"
             (click)="closeWhenCompact(sidenav)">
            <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.label | translate }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
